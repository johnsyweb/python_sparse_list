# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see:
# https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  versions:

    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.matrix.outputs.python-versions }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build matrix
      id: matrix
      run: |
        versions=$(python -c "import json; print(json.dumps(json.load(open('ci/python_versions.json'))['python_versions']))")
        echo "python-versions=${versions}" >> "$GITHUB_OUTPUT"

  build:
    needs: versions

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.versions.outputs.python-versions) }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install mise
      uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14

    - name: Set Python version
      run: mise use python@${{ matrix.python-version }}

    - name: Bootstrap
      run: mise run bootstrap

    - name: Lint
      run: mise run lint

    - name: Test
      run: mise run test -- --junitxml=test-results-${{ matrix.python-version }}.xml

    - name: Upload pytest test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: |
          coverage.xml
          htmlcov/
          test-results-${{ matrix.python-version }}.xml
      if: ${{ always() }}

