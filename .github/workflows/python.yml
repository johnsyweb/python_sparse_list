# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see:
# https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  versions:

    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.matrix.outputs.python-versions }}

    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Build matrix
      id: matrix
      run: |
        versions=$(python -c "import json; print(json.dumps(json.load(open('ci/python_versions.json'))['python_versions']))")
        echo "python-versions=${versions}" >> "$GITHUB_OUTPUT"

  build:
    needs: versions

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.versions.outputs.python-versions) }}

    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: flake8

    - name: Test with pytest
      run: pytest --cov=sparse_list --cov-report=xml --cov-report=html --junitxml=test-results-${{ matrix.python-version }}.xml

    - name: Upload pytest test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: |
          coverage.xml
          htmlcov/
          test-results-${{ matrix.python-version }}.xml
      if: ${{ always() }}

